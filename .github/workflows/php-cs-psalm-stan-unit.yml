name: 'PHP CI: check cs, psalm, stan, unit'

on:
  workflow_call:
    inputs:
      php_versions:
        description: PHP versions to use, string formatted as JSON array
        required: true
        type: string
      databases:
        description: Databases to test, string formatted as JSON array
        required: false
        type: string
        default: ''
      coverage_min_percentage:
        description: Minimum coverage percentage to pass the test
        required: false
        type: number
        default: 85

jobs:
  resolve-static-php:
    name: 'Resolve static-analysis PHP version'
    runs-on: 'ubuntu-latest'
    outputs:
      php-version: ${{ steps.latest.outputs.php-version }}

    steps:
      - name: 'Pick highest PHP version'
        id: 'latest'
        shell: bash
        run: |
          latest="$(echo '${{ inputs.php_versions }}' | jq -r '.[-1]')"
          echo "php-version=${latest}" >> "$GITHUB_OUTPUT"

  static-checks:
    name: 'Static checks (PHP ${{ matrix.php-version }})'
    needs: 'resolve-static-php'
    if: "!contains(github.event.head_commit.message || github.event.pull_request.title || '', '[skip ci]') && !contains(github.event.head_commit.message || github.event.pull_request.title || '', '[ci skip]')"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15

    strategy:
      fail-fast: true
      matrix:
        php-version:
          - ${{ needs.resolve-static-php.outputs.php-version }}

    steps:
      - name: 'Checkout current revision'
        uses: 'actions/checkout@v7'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php-version }}'
          tools: 'composer:v2'
          extensions: 'mbstring, intl'
          coverage: 'none'

      - name: 'Composer config GH token if available'
        run: 'if [ -n "$GH_TOKEN" ]; then composer config github-oauth.github.com ${GH_TOKEN}; fi'

      - name: 'Discover Composer cache directory'
        id: 'cachedir'
        run: echo "path=$(composer global config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: 'Share Composer cache across runs'
        uses: 'actions/cache@v6'
        with:
          path: '${{ steps.cachedir.outputs.path }}'
          key: "composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: 'Install dependencies with Composer'
        run: 'composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader'

      - name: 'Run PHP CodeSniffer'
        run: |
          if composer run --list | grep -q "cs-check"; then
            composer run cs-check
          else
            vendor/bin/phpcs -n
          fi

      - name: 'Run Psalm'
        run: 'vendor/bin/psalm --php-version=${{ matrix.php-version }}'

      - name: 'Run PHPStan'
        run: 'vendor/bin/phpstan analyse --no-progress --error-format=github'

  unit:
    name: 'Run unit tests (PHP ${{ matrix.php-version }} / ${{ matrix.db.vendor }})'
    needs: 'static-checks'
    if: "needs.static-checks.result == 'success' && inputs.databases != '' && !contains(github.event.head_commit.message || github.event.pull_request.title || '', '[skip ci]') && !contains(github.event.head_commit.message || github.event.pull_request.title || '', '[ci skip]')"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        php-version: ${{ fromJSON(inputs.php_versions) }}
        db: ${{ fromJSON(inputs.databases || '[{"vendor":"skip","pdo":"sqlite","dsn":"sqlite://tmp/test.sql","image":"nginx:alpine","options":"--health-cmd \\\"/bin/true\\\" --health-interval 1s --health-timeout 2s --health-retries 5"}]') }}

    env:
      PHP_VERSION: '${{ matrix.php-version }}'
      DB_VENDOR: '${{ matrix.db.vendor }}'
      DATABASE_URL: '${{ matrix.db.dsn }}'
      DATABASE_TEST_URL: '${{ matrix.db.dsn }}'
      FILE_PREFIX: '${{ github.run_id }}-${{ matrix.php-version }}-${{ strategy.job-index }}'

    services:
      db:
        image: '${{ matrix.db.image }}'
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_USER: 'bedita'
          MYSQL_PASSWORD: 'bedita'
          MYSQL_DATABASE: 'bedita'
          POSTGRES_USER: 'bedita'
          POSTGRES_PASSWORD: 'bedita'
          POSTGRES_DB: 'bedita'
        ports:
          - '3306:3306'
          - '5432:5432'
        options: '${{ matrix.db.options }}'

    steps:
      - name: 'Checkout current revision'
        uses: 'actions/checkout@v7'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php-version }}'
          tools: 'composer:v2'
          extensions: 'mbstring, intl, pdo_${{ matrix.db.pdo }}'
          coverage: 'pcov'
          ini-values: 'pcov.directory=., pcov.exclude="~vendor~"'

      - name: 'Discover Composer cache directory'
        id: 'cachedir'
        run: echo "path=$(composer global config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: 'Share Composer cache across runs'
        uses: 'actions/cache@v6'
        with:
          path: '${{ steps.cachedir.outputs.path }}'
          key: "composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}"
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: 'Install gettext'
        run: 'sudo apt-get install -y gettext'

      - name: 'Install dependencies with Composer'
        run: 'composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader'

      - name: 'Dump Composer autoloader'
        run: 'composer dump-autoload --classmap-authoritative --no-cache'

      - name: 'Run PHPUnit with coverage and JUnit report'
        run: 'vendor/bin/phpunit --coverage-clover=${{ env.FILE_PREFIX }}-clover.xml --log-junit ${{ env.FILE_PREFIX }}-junit.xml'

      - name: 'Upload test results to Codecov'
        uses: 'codecov/test-results-action@v1'
        with:
          files: './${{ env.FILE_PREFIX }}-junit.xml'
          token: '${{ secrets.CODECOV_TOKEN }}'

      - name: 'Check test coverage'
        uses: 'johanvanhelden/gha-clover-test-coverage-check@v1'
        with:
          percentage: '${{ inputs.coverage_min_percentage }}'
          filename: '${{ env.FILE_PREFIX }}-clover.xml'

      - name: 'Export coverage results'
        uses: 'codecov/codecov-action@v7'
        with:
          token: '${{ secrets.CODECOV_TOKEN }}'
          files: './${{ env.FILE_PREFIX }}-clover.xml'
          env_vars: PHP_VERSION,DB_VENDOR

      - name: 'Archive code coverage results'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'PHP-${{ matrix.php-version }}-${{ matrix.db.vendor }}-${{ strategy.job-index }}-${{ github.sha }}'
          path: '${{ env.FILE_PREFIX }}-clover.xml'